# Local development dependencies for the API (Phase 0).
#
# Host port note: Postgres is published on 5434. Both 5432 and 5433 are taken
# by native Postgres services on this dev machine. That clash is silent and
# worth knowing about: Docker still starts, binding the port on IPv6 only,
# while `localhost` resolves to IPv4 first and reaches the *native* server —
# which surfaces as a confusing P1000 auth failure rather than a port error.
# Bind explicitly to 127.0.0.1 so a half-bound port fails loudly instead.
# Inside the compose network the container still listens on the standard 5432.
services:
  postgres:
    image: postgres:16-alpine
    container_name: adhd-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: adhd
      POSTGRES_PASSWORD: adhd_local_dev
      POSTGRES_DB: adhd
    ports:
      - '127.0.0.1:5434:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U adhd -d adhd']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: adhd-redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  # Local stand-in for S3/R2. Same 127.0.0.1 binding as the other two: a
  # half-bound port here would fail the same confusing IPv6-only way.
  # 9000 is the S3 API. The console is published on 9011, not its native 9001,
  # which is already taken on this dev machine — same class of clash as the
  # Postgres 5432/5433 one above. Inside the container both keep their standard
  # ports; only the host side moves.
  #
  # The bucket is NOT created here. See StorageService.ensureBucket for why the
  # app does it instead of an mc init container.
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: adhd-minio
    restart: unless-stopped
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: adhd
      MINIO_ROOT_PASSWORD: adhd_local_dev
    ports:
      - '127.0.0.1:9000:9000'
      - '127.0.0.1:9011:9001'
    volumes:
      - minio_data:/data
    healthcheck:
      # `mc` ships in the image; the older curl-based probe does not work since
      # the release that dropped curl from the container.
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres_data:
  redis_data:
  minio_data:
