# Local development dependencies for the API (Phase 0).
#
# Host port note: Postgres is published on 5434. Both 5432 and 5433 are taken
# by native Postgres services on this dev machine. That clash is silent and
# worth knowing about: Docker still starts, binding the port on IPv6 only,
# while `localhost` resolves to IPv4 first and reaches the *native* server —
# which surfaces as a confusing P1000 auth failure rather than a port error.
# Bind explicitly to 127.0.0.1 so a half-bound port fails loudly instead.
# Inside the compose network the container still listens on the standard 5432.
services:
  postgres:
    # pgvector (Phase 2, owner-approved 2026-10-09) for task embeddings. Debian-based,
    # unlike the old postgres:16-alpine: glibc and musl collate text differently,
    # so the data moved by dump/restore into a fresh volume rather than reusing
    # the old one. Pinned - keep the tag in step with .github/workflows/ci.yml.
    image: pgvector/pgvector:0.8.0-pg16
    container_name: adhd-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: adhd
      POSTGRES_PASSWORD: adhd_local_dev
      POSTGRES_DB: adhd
    ports:
      - '127.0.0.1:5434:5432'
    volumes:
      - postgres_pgvector_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U adhd -d adhd']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: adhd-redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  # Local stand-in for S3/R2: SeaweedFS's S3 gateway. It replaced MinIO in
  # October 2026, when MinIO stopped publishing images (minio/minio on Docker
  # Hub and quay.io both refuse pulls), which broke CI on a fresh runner.
  # The app speaks plain S3 through @aws-sdk/client-s3, so only this block and
  # the CI step changed — the MINIO_* env names are kept so no .env moves.
  #
  # Same 127.0.0.1 binding as the other two. The S3 gateway listens on 8333
  # inside the container and is published on 9000, where MinIO was, so
  # MINIO_ENDPOINT is unchanged. There is no console; the S3 API is all the
  # app uses.
  #
  # `server -s3` runs master, volume, filer and gateway in one process — fine
  # for dev and CI, not a production topology. `volumeSizeLimitMB` keeps the
  # preallocated volumes small; the 30 GB default is sized for real disks.
  # AWS_* here are the gateway's admin identity, matched to MINIO_ACCESS_KEY /
  # MINIO_SECRET_KEY in apps/api/.env.
  #
  # The bucket is NOT created here. See StorageService.onModuleInit for why the
  # app does it instead of an init container.
  storage:
    image: chrislusf/seaweedfs:4.48
    container_name: adhd-storage
    restart: unless-stopped
    command: ['server', '-dir=/data', '-s3', '-s3.port=8333', '-master.volumeSizeLimitMB=64']
    environment:
      AWS_ACCESS_KEY_ID: adhd
      AWS_SECRET_ACCESS_KEY: adhd_local_dev
    ports:
      - '127.0.0.1:9000:8333'
    volumes:
      - storage_data:/data
    healthcheck:
      # An unsigned request to the gateway answers 403 once it is serving;
      # before that the connection is refused. 403 is the "up" signal.
      test: ['CMD-SHELL', 'curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8333/ | grep -q 403']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

volumes:
  # postgres_data is the pre-pgvector (alpine) volume, kept so the switch can be
  # rolled back; safe to `docker volume rm adhdplanner_postgres_data` later.
  postgres_data:
  postgres_pgvector_data:
  redis_data:
  storage_data:
