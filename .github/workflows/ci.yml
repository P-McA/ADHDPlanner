name: CI

# `main` is the default branch. Both jobs below are required checks on it, so
# removing or renaming a job here also silently removes a merge gate — update
# the branch protection contexts in step with any rename.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push supersedes an in-flight run for the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # No cache masking: every task really executes rather than replaying a hit.
  # Turbo remote caching can replace this once it is worth the wall-clock.
  TURBO_FORCE: 'true'
  TURBO_TELEMETRY_DISABLED: '1'

jobs:
  verify:
    name: lint / typecheck / test / build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      # Before setup-node, which needs pnpm on PATH to resolve its cache dir.
      # Version comes from the `packageManager` field, so it cannot drift.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Required, not optional: the client is generated into node_modules, so a
      # fresh install has none. Verified by deleting it locally — `typecheck`
      # still passes (Prisma ships stub types) but `test` and `build` both fail
      # with "Cannot find module '.prisma/client/default'".
      - name: Generate Prisma client
        # `generate` only reads the schema; it never opens a connection. But it
        # loads prisma.config.ts, whose `env('DATABASE_URL')` throws outright on
        # an unset variable regardless of the command — which is what failed the
        # first run of this workflow. The placeholder satisfies that check and is
        # scoped to this step, so no later step can come to depend on it.
        env:
          DATABASE_URL: postgresql://unused:unused@127.0.0.1:5432/unused
        run: pnpm --filter @adhd/api db:generate

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  e2e:
    name: e2e (Postgres + Redis + object storage)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Versions must match docker-compose.yml. If you bump one, bump both.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: adhd
          POSTGRES_PASSWORD: adhd_local_dev
          POSTGRES_DB: adhd
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U adhd -d adhd"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      # Object storage is NOT here — see the "Start object storage" step below.

    env:
      # Port 5432 here, not the 5434 used locally: that offset exists only to
      # dodge native Postgres instances on the dev machine.
      DATABASE_URL: postgresql://adhd:adhd_local_dev@localhost:5432/adhd?schema=public
      REDIS_URL: redis://localhost:6379
      # SeaweedFS's S3 gateway, published on 9000 as in docker-compose.yml.
      # The MINIO_* names predate the switch away from MinIO and are kept.
      MINIO_ENDPOINT: http://127.0.0.1:9000
      MINIO_REGION: us-east-1
      MINIO_BUCKET: voice-memos
      MINIO_ACCESS_KEY: adhd
      MINIO_SECRET_KEY: adhd_local_dev

    steps:
      # Object storage cannot be a `services:` entry. That block has no way to
      # set a container's command: `options` are passed to `docker create`,
      # which places them *before* the image name, and the image needs
      # `server -s3 ...` to serve S3 at all. As a service it would never listen
      # on the S3 port, and because the health check would then fail rather
      # than the job, it would look like a broken test suite instead of a
      # missing argument. Run explicitly instead.
      #
      # Same pinned image and same command as docker-compose.yml; keep them in
      # step. SeaweedFS replaced MinIO when MinIO stopped publishing images.
      - name: Start object storage
        run: |
          docker run -d --name storage \
            -p 9000:8333 \
            -e AWS_ACCESS_KEY_ID=adhd \
            -e AWS_SECRET_ACCESS_KEY=adhd_local_dev \
            chrislusf/seaweedfs:4.48 \
            server -dir=/data -s3 -s3.port=8333 -master.volumeSizeLimitMB=64

          # An unsigned request answers 403 once the gateway is serving.
          for _ in $(seq 1 30); do
            if [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:9000/)" = 403 ]; then
              echo "Object storage serving"
              exit 0
            fi
            sleep 2
          done

          echo "Object storage never started serving:"
          docker logs storage
          exit 1

      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # `migrate deploy` applies committed migrations only — it never generates
      # one — so a schema change without a migration fails here instead of
      # silently drifting.
      - name: Apply migrations
        run: pnpm --filter @adhd/api exec prisma migrate deploy

      # The e2e suite stubs ClerkAuthGuard rather than issuing real session
      # tokens, exactly as it does locally: verifying a genuine Clerk token
      # needs a live tenant, so that path stays uncovered here too. What CI does
      # cover is the unauthenticated path — every guarded route 401s, /health
      # stays public — which is what catches a guard left off a controller.
      # No Clerk secrets are needed and none would help: auth.e2e-spec.ts blocks
      # outbound fetch for its lifetime, so it returns the same result on a
      # runner with no DNS and no egress. See the Phase 1.2 note in CLAUDE.md.
      #
      # One file is the exception: mobile-client.e2e-spec.ts runs the *real*
      # guard, because the claim it exists to prove is that the phone's dev
      # sign-in is gated server-side, and a stubbed guard cannot prove that. It
      # arms DEV_AUTH_BYPASS in-process and supplies its own placeholder Clerk
      # keys, so it still needs no secrets and reaches nothing but 127.0.0.1.
      - name: E2E
        run: pnpm test:e2e
