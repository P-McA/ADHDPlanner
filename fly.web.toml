# Fly.io config for the web client.
#
# Deploy with:
#   fly deploy -c fly.web.toml \
#     --build-arg NEXT_PUBLIC_API_URL=https://adhd-planner-api.fly.dev
#
# NEXT_PUBLIC_API_URL is baked into the bundle, so it is a build arg rather
# than a secret. NEXT_PUBLIC_DEV_MODE stays false for a deployed demo.

app = "adhd-planner-web"
primary_region = "lhr"

[build]
  dockerfile = "apps/web/Dockerfile"

[env]
  NODE_ENV = "production"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "15s"
    interval = "30s"
    method = "GET"
    path = "/"
    timeout = "5s"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
