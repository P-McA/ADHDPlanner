packages:
  - 'apps/*'
  - 'packages/*'

# pnpm blocks dependency build scripts by default. Each entry here is a
# decision, not a default: `true` where the package compiles or downloads a
# native binding and is non-functional without its build step, `false` where we
# have looked at it and chosen to keep the build blocked.
allowBuilds:
  '@parcel/watcher': true # nest start --watch
  '@prisma/engines': true # downloads the query/schema engine binaries
  '@swc/core': true # decorator metadata for Vitest (apps/api)
  # Pulled in by @clerk/expo (its web build). Its postinstall only rewrites a
  # browser bundle; nothing on native or in tests needs it.
  browser-tabs-lock: false
  # Transitive via @clerk/expo. The postinstall prints a funding banner and
  # nothing else — the polyfills ship prebuilt.
  core-js: false
  esbuild: true # fetches its platform binary (vitest transform pipeline)
  # Optional native accelerator for msgpackr, which BullMQ uses to encode job
  # payloads. Blocked deliberately: msgpackr falls back to its pure-JS encoder
  # when the addon is absent, and our payloads are a single uuid, so there is
  # nothing here for a native encoder to speed up. Allowing it would add a
  # node-gyp compile to every install and CI runner to buy that nothing.
  msgpackr-extract: false
  prisma: true # CLI postinstall, needs the engines above
  unrs-resolver: true # import resolution for eslint-config-next
minimumReleaseAgeExclude:
  - unplugin-swc@1.6.0
  - '@expo/cli@57.0.23'
  - '@expo/metro-file-map@57.0.3'
  - babel-preset-expo@57.0.11
  - expo-modules-core@57.0.17
  - expo-modules-jsi@57.1.0
  - expo@57.0.21
