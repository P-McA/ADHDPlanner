packages:
  - 'apps/*'
  - 'packages/*'

# pnpm blocks dependency build scripts by default. Each of these compiles or
# downloads a native binding and is non-functional without its build step.
allowBuilds:
  '@parcel/watcher': true # nest start --watch
  '@swc/core': true # decorator metadata for Vitest (apps/api)
  unrs-resolver: true # import resolution for eslint-config-next

# pnpm 12 quarantines very recently published versions by default. unplugin-swc
# 1.6.0 is newer than that threshold; allowed explicitly so apps/api can test.
minimumReleaseAgeExclude:
  - unplugin-swc@1.6.0
